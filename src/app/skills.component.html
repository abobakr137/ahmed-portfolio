<section class="container py-5">
  <h1 class="fw-bold mb-4 text-center reveal delay-1">Skills</h1>
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let group of skillGroups">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-4 text-primary text-center reveal delay-1">{{ group.category }}</h4>
          <div *ngFor="let skill of group.skills" class="mb-4">
            <div class="d-flex align-items-center mb-1 reveal delay-2">
              <i [class]="skill.icon + ' fs-3 text-primary me-2'" aria-hidden="true"></i>
              <span class="fw-semibold">{{ skill.name }}</span>
              <span class="ms-auto small text-muted">{{ skill.level }}%</span>
            </div>
            <div class="progress" style="height: 8px;">
              <div class="progress-bar bg-primary" role="progressbar" [style.width]="skill.level + '%'" [attr.aria-valuenow]="skill.level" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
