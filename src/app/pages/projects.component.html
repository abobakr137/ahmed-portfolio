<section class="container py-5">
  <h1 class="fw-bold mb-4 text-center">Projects</h1>
  <div class="row g-4">
    <div class="col-sm-12 col-md-6 col-lg-4" *ngFor="let project of projects">
      <div class="card card-project h-100 shadow-sm">
        <img *ngIf="project.image" [src]="project.image" class="card-img-top" [alt]="project.title">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text text-muted mb-3">{{ project.description }}</p>

          <div class="mb-3">
            <small class="text-muted">Tech stack</small>
            <div class="mt-2">
              <span *ngFor="let tag of project.tags" class="badge bg-light text-primary border me-1 mb-1">{{ tag }}</span>
            </div>
          </div>

          <div class="mt-auto d-flex justify-content-between align-items-center">
            <div class="text-muted small">&nbsp;</div>
            <a *ngIf="project.link" [href]="project.link" target="_blank" rel="noopener" class="btn btn-primary btn-sm">
              <i class="bi bi-box-arrow-up-right me-1"></i>
              View Demo
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
