<section class="container py-5">
  <h1 class="fw-bold mb-4 text-center">Skills</h1>
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let group of skillGroups">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-4 text-primary text-center">{{ group.category }}</h4>
          <div *ngFor="let skill of group.skills" class="mb-4">
            <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
              <i [class]="skill.icon + ' fs-3 text-primary'" aria-hidden="true"></i>
              <div class="text-start">
                <div class="d-flex align-items-center">
                  <span class="fw-semibold me-2">{{ skill.name }}</span>
                  <small class="text-muted">{{ skill.level }}%</small>
                </div>
                <div class="progress mt-2" style="height: 8px; max-width:320px;">
                  <div class="progress-bar bg-primary" role="progressbar" [style.width]="skill.level + '%'" [attr.aria-valuenow]="skill.level" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-center mt-2">
              <ng-container *ngFor="let _ of starsArray(skill.level); let i = index">
                <i class="bi bi-star-fill text-warning me-1" aria-hidden="true"></i>
              </ng-container>
              <ng-container *ngFor="let _ of emptyStars(skill.level); let j = index">
                <i class="bi bi-star text-muted me-1" aria-hidden="true"></i>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
